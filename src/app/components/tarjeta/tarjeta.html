
<article class="tarjeta" [class.confirmat]="afegitAlCarret">

    <h2>{{producte.nom}}</h2>

    <p class="categoria">{{producte.categoria}}</p>

    <p class="preu">
        {{producte.preu}} € (+IVA): {{preuAmbIva}} €
    </p>

    <p>Estoc: {{producte.estoc}} unitats</p>

    <p>{{estatDisponibilitat}}</p>

    <button
        [disabled]="afegitAlCarret || !teEstoc"
        (click)="afegir()">
        Afegir al carret
    </button>

</article>
