<section class="botiga" [class.compacte]="modeCompacte">
     <p> Carret: {{ carret.join(', ')}}</p>
    <span class="resum"> {{carret.length}} - {{totalCarret.toFixed(2)}} € </span>

    <h1> {{title}} </h1>
    <input type="search" placeholder="Cerca un producte..." (input)="onCerca($event)" />
    @for (p of productesVisibles; track p.id){
        <app-fitxa-producte 
        [producte] = "p" 
        [enCarret] = "alCarret(p)"
        (afegir)="afegir($event)"
        (treure)="treure($event)"
        />
    } @empty {
        <p class="buit"> No hi ha cap producte que coincideixi amb {{cerca}}</p>
    }
   

    <div class="graella">
        @for (p of productes; track p.id){
       
        }
    </div>
</section>
