<section class="botiga" [class.compacte]="modeCompacte">
    <h1> {{title}} </h1>
    <input type="search" placeholder="Cerca un producte..." (input)="onCerca($event)" />
    @for (p of productesVisibles; track p.id){
        .....
    } @empty {
        <p class="buit"> No hi ha cap producte que coincideixi amb {{cerca}}</p>
    }



    <p> Carret: {{ carret.join(', ')}}</p>
    <span class="resum"> {{carret.length}} - {{totalCarret.toFixed(2)}} € </span>

    <div class="graella">
        @for (p of productes; track p.id){
        <article [class]="classesFitxa(p)">
            <img [src]="imatgeSegura(p)" [alt]="p.nom" class="imatge" />
            <h2> {{ p.nom }} </h2>
            <p class="preu" [style.color]="p.preu > 500 ? '#C00000' : '#1F4E79'"> {{p.preu}} €</p>
            <button class="btn-compra" [disabled]="!teEstoc(p)" (click)="afegir(p)"> Afegir al carret </button>
            <a [href]="urlFitxa(p)" [title]="'Fitxa de ' + p.nom" target="_blank"> Veure fitxa producte</a>
            <button class="btn-treure" (click)="treure(p)" [disabled]="!alCarret(p)" > Treure del carret </button>
        </article>
        }
    </div>
</section>
